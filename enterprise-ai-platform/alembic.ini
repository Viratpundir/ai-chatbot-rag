# alembic.ini
# -----------
# The sqlalchemy.url is intentionally blank here — it is injected
# at runtime by migrations/env.py from the DATABASE_URL environment
# variable via app.core.config.settings.
# Never put a real connection string in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Blank — overridden in env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
